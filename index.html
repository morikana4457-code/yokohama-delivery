<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>横浜 納品報告</title>

  <meta name="theme-color" content="#0876d8">
  <meta name="apple-mobile-web-app-title" content="横浜">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="apple-touch-icon" sizes="180x180" href="yokohama-deliverry-icon.png">

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: #eef4f8;
      color: #17324d;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 420px);
      background: #fff;
      border-radius: 20px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 8px 28px rgba(0,0,0,.10);
    }
    .icon {
      width: 124px;
      height: 124px;
      object-fit: cover;
      display: block;
      margin: 0 auto 18px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 25px;
      line-height: 1.3;
    }
    p {
      margin: 0 0 18px;
      color: #5f7182;
      font-size: 15px;
      line-height: 1.6;
    }
    .open-button {
      display: block;
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 13px;
      background: #0f7548;
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      text-decoration: none;
      line-height: 58px;
    }
    .note {
      margin-top: 17px;
      font-size: 13px;
      line-height: 1.6;
      color: #6b7b89;
    }
  </style>

  <script>
    (function () {
      var gasUrl = "https://script.google.com/macros/s/AKfycbxQU_q2_2iG4RfADWcJ6-hzyK_lC5zu7HvRV5u7nrN4T7ggvpLyaZm_AcG9KKfDLe-A/exec";
      var isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;

      if (isStandalone) {
        window.location.replace(gasUrl);
      }
    })();
  </script>
</head>

<body>
  <main class="card">
    <img class="icon" src="yokohama-deliverry-icon.png" alt="横浜">
    <h1>横浜 納品報告</h1>
    <p>
      Safariでこのページを開き、<br>
      「共有」→「ホーム画面に追加」を選択してください。
    </p>

    <a class="open-button" href="https://script.google.com/macros/s/AKfycbxQU_q2_2iG4RfADWcJ6-hzyK_lC5zu7HvRV5u7nrN4T7ggvpLyaZm_AcG9KKfDLe-A/exec">
      納品報告を開く
    </a>

    <div class="note">
      ホーム画面から起動した場合は、<br>
      自動で横浜営業所の納品報告を開きます。
    </div>
  </main>
</body>
</html>
